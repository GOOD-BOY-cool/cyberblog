<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="全息核心动态图">
  <defs>
    <radialGradient id="hc-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6fdff" stop-opacity=".95"/>
      <stop offset="38%" stop-color="#22f0ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#22f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hc-halo" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#8b5cff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8b5cff" stop-opacity=".22"/>
    </radialGradient>
    <linearGradient id="hc-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22f0ff"/>
      <stop offset="52%" stop-color="#8b5cff"/>
      <stop offset="100%" stop-color="#ff2d78"/>
    </linearGradient>
    <linearGradient id="hc-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d78" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff2d78"/>
      <stop offset="70%" stop-color="#22f0ff"/>
      <stop offset="100%" stop-color="#22f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="hc-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="hc-clip"><circle cx="280" cy="280" r="150"/></clipPath>
  </defs>

  <!-- 外圈光晕 -->
  <circle cx="280" cy="280" r="252" fill="url(#hc-halo)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 外层刻度环（顺时针） -->
  <g transform="translate(280 280)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="46s" repeatCount="indefinite"/>
      <circle r="242" fill="none" stroke="url(#hc-ring)" stroke-width="1" stroke-opacity=".55" stroke-dasharray="2 10"/>
      <circle r="222" fill="none" stroke="#22f0ff" stroke-width="1" stroke-opacity=".18"/>
      <!-- 刻度 -->
      <g stroke="#22f0ff" stroke-width="2" stroke-opacity=".55">
        <line x1="0" y1="-222" x2="0" y2="-212"/>
        <line x1="0" y1="222" x2="0" y2="212"/>
        <line x1="-222" y1="0" x2="-212" y2="0"/>
        <line x1="222" y1="0" x2="212" y2="0"/>
      </g>
    </g>
  </g>

  <!-- 中层双弧（逆时针） -->
  <g transform="translate(280 280)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
      <circle r="186" fill="none" stroke="url(#hc-ring)" stroke-width="2" stroke-linecap="round"
              stroke-dasharray="150 90" stroke-opacity=".95" filter="url(#hc-glow)"/>
      <circle r="160" fill="none" stroke="#ff2d78" stroke-width="1.5" stroke-linecap="round"
              stroke-dasharray="40 260" stroke-opacity=".85"/>
    </g>
  </g>

  <!-- 内层虚线环（快转） -->
  <g transform="translate(280 280)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <circle r="132" fill="none" stroke="#22f0ff" stroke-width="1" stroke-opacity=".45" stroke-dasharray="8 12"/>
    </g>
  </g>

  <!-- 六边形骨架 -->
  <g transform="translate(280 280)" fill="none" stroke="#8b5cff" stroke-opacity=".5" stroke-width="1.2">
    <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52">
      <animate attributeName="stroke-opacity" values=".2;.7;.2" dur="4.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" stroke="#22f0ff" stroke-opacity=".35"/>
  </g>

  <!-- 核心脉冲 -->
  <circle cx="280" cy="280" r="96" fill="url(#hc-core)">
    <animate attributeName="r" values="86;104;86" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="280" r="26" fill="#eafdff">
    <animate attributeName="opacity" values="1;.55;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 核心内波形 -->
  <g clip-path="url(#hc-clip)">
    <path d="M180 280 L206 280 L216 250 L228 312 L240 226 L252 334 L264 262 L276 292 L288 258 L300 306 L312 238 L324 316 L336 268 L348 292 L358 280 L380 280"
          fill="none" stroke="url(#hc-wave)" stroke-width="2" stroke-linecap="round" filter="url(#hc-glow)" stroke-dasharray="420" stroke-dashoffset="420">
      <animate attributeName="stroke-dashoffset" values="420;0;0;420" keyTimes="0;.45;.8;1" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 扫描线 -->
  <g clip-path="url(#hc-clip)">
    <rect x="120" y="120" width="320" height="10" fill="#22f0ff" opacity=".14">
      <animate attributeName="y" values="120;430;120" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 环绕数据点 -->
  <g transform="translate(280 280)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <circle cx="0" cy="-242" r="3.5" fill="#ff2d78" filter="url(#hc-glow)"/>
      <circle cx="0" cy="242" r="2.5" fill="#22f0ff"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
      <circle cx="186" cy="0" r="2.5" fill="#8b5cff"/>
    </g>
  </g>

  <!-- 故障碎片 -->
  <g fill="#ff2d78" opacity=".8">
    <rect x="150" y="176" width="34" height="2">
      <animate attributeName="x" values="150;214;150" dur="3.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="3.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="368" y="372" width="46" height="2">
      <animate attributeName="x" values="368;300;368" dur="4.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;0" dur="4.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="238" y="120" width="22" height="1.5" fill="#22f0ff">
      <animate attributeName="opacity" values=".9;0;.9" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 角标 -->
  <g stroke="#22f0ff" stroke-opacity=".45" stroke-width="1" fill="none">
    <path d="M44 96 L44 44 L96 44"/>
    <path d="M516 96 L516 44 L464 44"/>
    <path d="M44 464 L44 516 L96 516"/>
    <path d="M516 464 L516 516 L464 516"/>
  </g>
  <text x="280" y="540" text-anchor="middle" fill="#22f0ff" fill-opacity=".45"
        font-family="ui-monospace, Consolas, monospace" font-size="9" letter-spacing="5">SIGNAL / NODE-07</text>
</svg>
